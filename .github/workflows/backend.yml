name: backend

# The reasoning module and the ontology it reads. `data/config/**` is in the filter because
# tests/test_ontology_matches_config.py exists to catch a species or habitat edit there that
# species.ttl was not given; without it the drift guard would only run when nobody needs it.
on:
  pull_request:
    paths: ["backend/**", "ontology/**", "data/config/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "ontology/**", "data/config/**"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # pyproject's testpaths also collects ../ontology/tests.
      - run: pytest -q
