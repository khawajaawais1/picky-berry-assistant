name: data
on:
  pull_request:
    paths: ["data/**", ".github/workflows/data.yml"]
  push:
    branches: [main]
    paths: ["data/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[msnfi,dev]"
      - run: ruff check src tests
      - run: pytest
