name: mobile

on:
  pull_request:
    paths: ["app/**", ".github/workflows/mobile.yml", ".gitleaks.toml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/mobile.yml", ".gitleaks.toml"]
  workflow_dispatch:

# Verification only: this workflow never deploys or publishes.
permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  verify:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test -- --ci

      - name: Expo dependency and config health
        run: npx --yes expo-doctor

  secrets:
    name: Secret scan
    # Reads history rather than the app, so it runs beside the fast gate instead of behind it:
    # a committed key must fail the pull request even when a test is red. The scan covers every
    # commit reachable from HEAD, because a key removed from the working tree is still in the
    # history that shipped.
    #
    # The scanner is pinned by version **and** SHA-256: CI downloads a release binary, and a
    # moved tag must not be able to change what runs here (SECURITY.md §14). This workflow is
    # path-filtered to `app/**` and the two files that configure it, so a change outside `app/`
    # does not start the scan (SECURITY.md §9 records that limit).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan is about what was committed, not only what the diff adds.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks

      - name: Scan the history
        run: /tmp/gitleaks-bin/gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  native:
    name: Native bundle exports
    # The web export cannot see a platform-specific module or transform failure. This job
    # builds the JavaScript bundle each native target actually ships; it is still not a
    # device run (TESTING.md §10).
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export the iOS and Android bundles
        run: npm run build:native
        env:
          EXPO_NO_TELEMETRY: "1"

  layout:
    name: Layout, text sizes, built-artifact states and the accessibility tree
    # Only when the fast gate is green: measuring a broken build wastes a browser
    # download and a web build. See ADR-018, ADR-019 and TESTING.md §12.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the browser the harness drives
        run: npx playwright install --with-deps chromium

      # The design is measured against Android's own typeface, so the runner needs it: without
      # Roboto, Chromium falls back to a Liberation font whose glyphs are wider, and Finnish copy
      # at 200 % was reported as clipped here while passing on a machine that had the font the
      # app is designed with (found in CI, 2026-10-21).
      - name: Install the typeface the design is measured with
        run: sudo apt-get update && sudo apt-get install -y fonts-roboto

      # Builds the static web export, serves it and measures every built screen in
      # Finnish and English, at the design's text size and at the largest system one
      # (e2e/layout.spec.ts), then checks the states the built consent controls expose, the
      # consent record they write, and the accessibility tree of every built screen — role,
      # accessible name and declared state on every control (e2e/accessibility.spec.ts,
      # e2e/a11y-tree.ts; TESTING.md §12). The webServer in
      # playwright.config.ts owns both the build and the server, so this is the whole job.
      - name: Measure every screen and check the built controls
        run: npm run test:layout
