name: secrets

# Repository-wide on purpose: a key is no less committed because of the folder it landed in,
# so this workflow has no `paths:` filter. `mobile.yml` and `data.yml` are filtered to their
# own folders; the scan cannot live in either without inheriting that blind spot
# (SECURITY.md §9). It runs beside them, not behind them: a secret must fail the pull request
# even when a test is red.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Verification only: this workflow never deploys or publishes.
permissions:
  contents: read

concurrency:
  group: secrets-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    # The scan covers every commit reachable from HEAD, because a key removed from the working
    # tree is still in the history that shipped.
    #
    # The scanner is pinned by version **and** SHA-256: CI downloads a release binary, and a
    # moved tag must not be able to change what runs here (SECURITY.md §14).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan is about what was committed, not only what the diff adds.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks

      - name: Scan the history
        run: /tmp/gitleaks-bin/gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
