name: server

on:
  pull_request:
    paths: ["picky-server/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["picky-server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

# Verification only: this workflow never deploys or publishes.
permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: picky-server

jobs:
  verify:
    name: Typecheck, lint, test, build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: picky-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e

      - name: OpenAPI documents
        run: npm run openapi:lint
