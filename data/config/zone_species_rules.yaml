# D11 – habitat suitability rules (Awais builds, Asmer owns the ecology).
# verified: false until Asmer adds sources. Values are 0–1 habitat fit per habitat class.
#
# A zone's suitability for a species is the area-weighted mean over its habitat classes:
#   suitability = Σ_h  fraction_h * rule[species][h]   /  Σ_h fraction_h
# Habitat classes come from the zone builder:
#   mire                    – OSM wetland (bog, fen, marsh …)
#   forest_spruce/pine/broadleaf/mixed – from Luke MS-NFI main tree species, if available
#   forest_unknown          – OSM forest without a tree-species source (default today)
# Fertility (MS-NFI site class 1–6) optionally shifts bilberry ↔ lingonberry/crowberry.
verified: false
min_suitability: 0.30        # rows below this are not written (species "cannot occur" there)

rules:
  bilberry:
    mire: 0.15
    forest_spruce: 0.95
    forest_pine: 0.65
    forest_mixed: 0.80
    forest_broadleaf: 0.45
    forest_unknown: 0.70
  lingonberry:
    mire: 0.25
    forest_spruce: 0.55
    forest_pine: 0.95
    forest_mixed: 0.75
    forest_broadleaf: 0.35
    forest_unknown: 0.70
  cloudberry:
    mire: 0.90
    forest_spruce: 0.10
    forest_pine: 0.20
    forest_mixed: 0.05
    forest_broadleaf: 0.02
    forest_unknown: 0.10
  crowberry:
    mire: 0.55
    forest_spruce: 0.15
    forest_pine: 0.70
    forest_mixed: 0.30
    forest_broadleaf: 0.10
    forest_unknown: 0.35

# Optional MS-NFI site fertility adjustment (kasvupaikka 2023 codes): 1 herb-rich, 2 herb-rich heath,
# 3 mesic, 4 sub-xeric, 5 xeric, 6 barren, 7 rocky/sandy/alluvial, 8–10 fjeld (not in the pilot).
# Multiplier applied after the habitat mean, then clipped to [0, 1].
fertility_multiplier:
  bilberry:    {1: 0.8, 2: 1.1, 3: 1.1, 4: 0.8, 5: 0.5, 6: 0.3, 7: 0.3}
  lingonberry: {1: 0.5, 2: 0.8, 3: 1.0, 4: 1.15, 5: 1.0, 6: 0.6, 7: 0.6}
  crowberry:   {1: 0.3, 2: 0.5, 3: 0.8, 4: 1.0, 5: 1.2, 6: 1.2, 7: 1.2}
  cloudberry:  {1: 1.0, 2: 1.0, 3: 1.0, 4: 1.0, 5: 1.0, 6: 1.0, 7: 1.0}
