[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picky-data"
version = "0.1.0"
description = "Team Picky data pipelines: pilot area, H3 zones, zone_species, weather/GDD, NDVI, basemap"
requires-python = ">=3.11"
authors = [{ name = "Awais" }]
# Core: enough to build zones and run checks. Pin exact versions once D2 is green on every laptop.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "pyproj>=3.6",
  "h3>=4.1,<5",
  "pyarrow>=15",
  "pyyaml>=6.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ndvi = ["sentinelhub>=3.11", "rasterio>=1.3"]
msnfi = ["rasterio>=1.3"]
db = ["sqlalchemy>=2.0", "geoalchemy2>=0.15", "psycopg[binary]>=3.1"]
all = ["picky-data[ndvi,msnfi,db]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
picky-data = "picky_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]
