openapi: 3.1.0
info:
  title: Berry Picker Picker Feeds API
  version: 1.0.0
  license:
    name: UNLICENSED
    identifier: LicenseRef-UNLICENSED
  description: "Reports and season figures the mobile app reads."
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /zones/{id}/reports:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: "A zone's recent reports"
      operationId: listZoneReports
      description: "Anonymous: rating, harvest, trust label and time. Optional species and limit (1–50)."
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema: { type: object }
        '404':
          description: "Not found"
          content:
            application/json:
              schema: { type: object }
        '422':
          description: "Invalid input"
          content:
            application/json:
              schema: { type: object }
        '401':
          description: "Not signed in"
  /me/reports:
    get:
      summary: "The caller's own reports"
      operationId: listMyReports
      description: "Newest first."
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema: { type: object }
        '401':
          description: "Not signed in"
  /me/season:
    get:
      summary: "The caller's season figures"
      operationId: getMySeason
      description: "Totals over accepted visits and reports in one Helsinki calendar year (default: this year)."
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema: { type: object }
        '422':
          description: "Invalid input"
          content:
            application/json:
              schema: { type: object }
        '401':
          description: "Not signed in"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
